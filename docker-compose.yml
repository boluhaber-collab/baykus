services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: baykus
      POSTGRES_PASSWORD: baykus
      POSTGRES_DB: baykus
    ports:
      - "5432:5432"
    volumes:
      - baykus_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baykus -d baykus"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg2://baykus:baykus@db:5432/baykus
      SECRET_KEY: baykus-dev-secret-change-in-production
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  baykus_pg:
